name: Ergebnistracker

on:
  schedule:
    # Zeiten in UTC (Winter: +1 h, Sommer: +2 h)
    - cron: "5 6 * * *"           # täglich ~07:05 Uhr: Spieltag-Übersicht
    - cron: "*/20 7-19 * * 0,6"   # Sa/So 08–20 Uhr alle 20 Minuten
    - cron: "*/30 15-19 * * 1-5"  # Mo–Fr 16–20 Uhr alle 30 Minuten (Jugendspiele unter der Woche)
  workflow_dispatch: {}            # manuell starten über "Run workflow"

concurrency:
  group: ergebnistracker
  cancel-in-progress: false        # laufende Beobachtung nie abbrechen

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Spiele beobachten
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py --watch

      - name: Zustand und Kalender speichern
        if: always()
        run: |
          git config user.name "ergebnistracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json docs/ergebnisse.ics
          git diff --cached --quiet || git commit -m "Update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
