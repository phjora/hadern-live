name: Ergebnistracker

on:
  schedule:
    # Zeiten in UTC (Winter: +1 h, Sommer: +2 h)
    - cron: "5 6 * * *"           # täglich ~07:05 Uhr: Spieltag-Übersicht
    - cron: "*/20 7-19 * * 0,6"   # Sa/So 08–20 Uhr alle 20 Minuten
    - cron: "*/30 15-19 * * 1-5"  # Mo–Fr 16–20 Uhr alle 30 Minuten (Jugendspiele unter der Woche)
  workflow_dispatch:                # manuell starten über "Run workflow"
    inputs:
      chained:
        description: "Automatische Übergabe (keine Testnachricht)"
        type: boolean
        default: false

concurrency:
  group: ergebnistracker
  cancel-in-progress: false        # laufende Beobachtung nie abbrechen

permissions:
  contents: write
  actions: write   # damit sich der Tracker bei Bedarf selbst neu starten kann

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # neuesten Stand holen, auch wenn der Lauf in der Warteschlange stand

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Spiele beobachten
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHAINED: ${{ inputs.chained }}
        run: python tracker.py --watch

      - name: Zustand und Kalender speichern
        if: always()
        run: |
          git config user.name "ergebnistracker-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/keep && cp state.json /tmp/keep/ && cp docs/ergebnisse.ics /tmp/keep/
          # Unser Zustand ist der neueste: auf aktuellen Stand setzen, Dateien drüberlegen, pushen
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/keep/state.json state.json && cp /tmp/keep/ergebnisse.ics docs/ergebnisse.ics
            git add state.json docs/ergebnisse.ics
            git diff --cached --quiet && exit 0
            git commit -q -m "Update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Bei Bedarf neuen Lauf starten (Übergabe vor dem 6-h-Limit)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .chain ]; then
            echo "Übergabe – nächste Prüfung $(cat .chain)"
            gh workflow run tracker.yml --ref main -f chained=true
          fi
